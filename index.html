<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Langar Mafia — Mess Tracker (Riyadh KSA)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #071912;
      --panel: #0c261c;
      --panel-2: #113325;
      --border: rgba(52, 211, 153, 0.2);
      --text: #ecfdf5;
      --muted: #94b8a8;
      --accent: #10b981;
      --accent-2: #059669;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: radial-gradient(circle at top, #0d2e21 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 60px;
    }

    .container { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-badge {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      display: grid;
      place-items: center;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
    }

    .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    h1 { font-size: 1.45rem; font-weight: 700; }

    .pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.35);
      text-transform: uppercase;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .dot.offline { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

    .actions-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 11px;
      font-weight: 600;
      transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-sync {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 0.88rem;
    }

    .btn-settle {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      padding: 11px 18px;
      font-size: 0.94rem;
      box-shadow: 0 8px 20px rgba(234, 88, 12, 0.28);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .tab-btn {
      padding: 13px 16px;
      border-radius: 12px;
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-2), #047857);
      color: #fff;
      border-color: transparent;
    }

    .summary-card {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.14), rgba(12, 38, 28, 0.92));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 22px;
    }

    .metric-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .metric-val { font-size: 2rem; font-weight: 800; }
    .metric-val .cur { font-size: 0.95rem; font-weight: 700; color: #6ee7b7; margin-right: 4px; }
    .metric-val.share .cur { color: #fcd34d; }
    .metric-sub { font-size: 0.84rem; color: var(--muted); margin-top: 4px; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 0.84rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
    }

    .members-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .member-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .member-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .member-name { font-size: 1.05rem; font-weight: 700; }
    .member-paid-label { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); }
    .member-paid-val { font-size: 1.45rem; font-weight: 800; margin: 4px 0 12px; }

    .bal-pill {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .bal-even { background: rgba(148, 184, 168, 0.12); color: var(--muted); }
    .bal-credit {
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .bal-owe {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .card-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }

    select, input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(52, 211, 153, 0.25);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.94rem;
    }

    .btn-add {
      background: var(--accent);
      color: #042016;
      padding: 11px 18px;
      font-size: 0.94rem;
      white-space: nowrap;
    }

    .expense-list { display: flex; flex-direction: column; gap: 10px; }

    .expense-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid rgba(52, 211, 153, 0.14);
    }

    .exp-main { display: flex; flex-direction: column; gap: 3px; }
    .exp-title { font-weight: 700; font-size: 0.96rem; }
    .exp-meta { font-size: 0.8rem; color: var(--muted); }
    .exp-right { display: flex; align-items: center; gap: 12px; }
    .exp-amount { font-weight: 800; color: #6ee7b7; font-size: 1rem; white-space: nowrap; }

    .btn-del {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.28);
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .empty-state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 0.92rem; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 560px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-head h2 { font-size: 1.2rem; }
    .btn-close { background: rgba(255, 255, 255, 0.08); color: var(--text); padding: 6px 11px; border-radius: 8px; }

    .transfer-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin: 14px 0;
    }

    .transfer-item { padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 0.94rem; }
    .transfer-item:last-child { border-bottom: none; }

    .modal-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn-copy { background: #0284c7; color: #fff; padding: 11px 15px; font-size: 0.9rem; flex: 1; }
    .btn-archive { background: var(--accent); color: #042016; padding: 11px 15px; font-size: 0.9rem; flex: 1; }

    .archive-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .archive-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #065f46;
      color: #ecfdf5;
      border: 1px solid rgba(110, 231, 183, 0.4);
      padding: 11px 16px;
      border-radius: 11px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 720px) {
      .summary-card, .members-grid, .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="brand-badge">🍲</div>
        <div>
          <div class="title-row">
            <h1>Langar Mafia</h1>
            <span class="pill">Riyadh KSA</span>
          </div>
          <div class="sync-status">
            <span class="dot offline" id="syncDot"></span>
            <span id="syncText">Connecting to Supabase live sync...</span>
          </div>
        </div>
      </div>
      <div class="actions-top">
        <button type="button" class="btn-sync" id="btnSync" onclick="syncFromCloud(true)">↻ Sync Now</button>
        <button type="button" class="btn-settle" onclick="openSettleModal()">🧮 Settle Month</button>
      </div>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabActiveBtn" onclick="switchTab('active')">📊 Active Mess</button>
      <button type="button" class="tab-btn" id="tabPastBtn" onclick="switchTab('past')">📜 Past Months (<span id="pastCount">0</span>)</button>
    </div>

    <div id="activeView">
      <div class="summary-card">
        <div>
          <div class="metric-label">Total Mess Spend</div>
          <div class="metric-val"><span class="cur">SAR</span><span id="totalSpend">0.00</span></div>
          <div class="metric-sub" id="itemCountSub">0 items logged this cycle</div>
        </div>
        <div>
          <div class="metric-label">Per-Head Share (÷ 4)</div>
          <div class="metric-val share"><span class="cur">SAR</span><span id="perHeadShare">0.00</span></div>
          <div class="metric-sub">Equal split • 4 roommates</div>
        </div>
      </div>

      <div class="section-head">
        <div class="section-title">Roommate Balances (Live)</div>
        <div style="font-size: 0.8rem; color: var(--muted);">+ Gets back • - Owes</div>
      </div>
      <div class="members-grid" id="membersGrid"></div>

      <div class="card-box">
        <div class="section-title" style="margin-bottom: 14px;">Add Mess Expense</div>
        <form class="form-grid" id="expenseForm" onsubmit="handleAddExpense(event)">
          <div>
            <label for="payerSelect">Paid By</label>
            <select id="payerSelect" required>
              <option value="Umar">Umar</option>
              <option value="Yaseen">Yaseen</option>
              <option value="Zaka">Zaka</option>
              <option value="Tahir">Tahir</option>
            </select>
          </div>
          <div>
            <label for="itemInput">Item / Description</label>
            <input id="itemInput" type="text" placeholder="e.g., Daal Chawal, Chicken, Groceries" required />
          </div>
          <div>
            <label for="amountInput">Amount (SAR)</label>
            <input id="amountInput" type="number" step="0.01" min="0.01" placeholder="0.00" required />
          </div>
          <button type="submit" class="btn-add">+ Add Expense</button>
        </form>
      </div>

      <div class="card-box">
        <div class="section-head">
          <div class="section-title">Logged Expenses This Month</div>
          <div style="font-size: 0.8rem; color: var(--muted);" id="expenseCountLabel">0 entries</div>
        </div>
        <div class="expense-list" id="expenseList"></div>
      </div>
    </div>

    <div id="pastView" style="display: none;">
      <div id="pastMonthsList"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="settleModal">
    <div class="modal">
      <div class="modal-head">
        <h2>Month-End Settlement (÷ 4)</h2>
        <button type="button" class="btn-close" onclick="closeSettleModal()">✕</button>
      </div>
      <div id="settleSummaryBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn-copy" onclick="copyWhatsAppSummary()">📋 Copy WhatsApp Summary</button>
        <button type="button" class="btn-archive" onclick="archiveAndResetMonth()">📦 Archive &amp; Reset Month</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MEMBERS = ["Umar", "Yaseen", "Zaka", "Tahir"];
    const SUPABASE_URL = "https://zuahgqemakcolavenxbl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HS7tflaJ_wd73zjLPcGXTQ_cYJjkJOf";
    const ROW_ID = "langar-mafia";
    const LOCAL_KEY = "langar_mafia_mess_state_v1";

    const sb = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    let state = { expenses: [], pastMonths: [], updated_at: null };
    let lastWhatsAppText = "";

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function setSyncIndicator(live, text) {
      const dot = document.getElementById("syncDot");
      const label = document.getElementById("syncText");
      dot.classList.toggle("offline", !live);
      label.textContent = text;
    }

    function saveLocal() {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch (_) {}
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(LOCAL_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = {
            expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [],
            pastMonths: Array.isArray(parsed.pastMonths) ? parsed.pastMonths : [],
            updated_at: parsed.updated_at || null
          };
        }
      } catch (_) {}
    }

    async function syncFromCloud(manual = false) {
      if (!sb) {
        setSyncIndicator(false, "Local cache mode (Supabase SDK unavailable)");
        return;
      }
      try {
        const { data: rows, error } = await sb
          .from("mess_state")
          .select("data, updated_at")
          .eq("id", ROW_ID)
          .limit(1);

        if (error) throw error;

        if (rows && rows.length > 0 && rows[0].data) {
          const d = rows[0].data;
          state = {
            expenses: Array.isArray(d.expenses) ? d.expenses : [],
            pastMonths: Array.isArray(d.pastMonths) ? d.pastMonths : [],
            updated_at: rows[0].updated_at || new Date().toISOString()
          };
          saveLocal();
          renderAll();
          setSyncIndicator(true, "Live synced via Supabase • All 4 devices");
          if (manual) showToast("Synced with group cloud!");
        } else {
          await pushToCloud(manual);
        }
      } catch (err) {
        loadLocal();
        renderAll();
        setSyncIndicator(false, "Local cache mode (" + (err.message || "check Supabase connection") + ")");
        if (manual) showToast("Could not reach cloud — showing local cache");
      }
    }

    async function pushToCloud(showMsg = false) {
      state.updated_at = new Date().toISOString();
      saveLocal();
      if (!sb) {
        setSyncIndicator(false, "Saved locally (Supabase SDK unavailable)");
        return;
      }
      try {
        const payload = {
          id: ROW_ID,
          data: {
            expenses: state.expenses,
            pastMonths: state.pastMonths
          },
          updated_at: state.updated_at
        };
        const { error } = await sb
          .from("mess_state")
          .upsert(payload, { onConflict: "id" });

        if (error) throw error;

        setSyncIndicator(true, "Live synced via Supabase • All 4 devices");
        if (showMsg) showToast("Saved to group cloud!");
      } catch (err) {
        setSyncIndicator(false, "Saved locally (" + (err.message || "retry pending") + ")");
        if (showMsg) showToast("Saved locally — check Supabase policy");
      }
    }

    function calculateTotals(expenses) {
      const paidBy = { Umar: 0, Yaseen: 0, Zaka: 0, Tahir: 0 };
      let total = 0;
      for (const exp of expenses) {
        const amt = Number(exp.amount) || 0;
        total += amt;
        if (paidBy[exp.payer] !== undefined) paidBy[exp.payer] += amt;
      }
      const perHead = total / 4;
      const balances = {};
      for (const m of MEMBERS) balances[m] = paidBy[m] - perHead;
      return { total, perHead, paidBy, balances };
    }

    function computeTransfers(balances) {
      const debtors = [];
      const creditors = [];
      for (const m of MEMBERS) {
        const net = Math.round((balances[m] || 0) * 100) / 100;
        if (net < -0.01) debtors.push({ person: m, amount: Math.abs(net) });
        else if (net > 0.01) creditors.push({ person: m, amount: net });
      }
      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transfers = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const pay = Math.min(debtors[i].amount, creditors[j].amount);
        const rounded = Math.round(pay * 100) / 100;
        if (rounded > 0) transfers.push({ from: debtors[i].person, to: creditors[j].person, amount: rounded });
        debtors[i].amount -= pay;
        creditors[j].amount -= pay;
        if (debtors[i].amount < 0.01) i++;
        if (creditors[j].amount < 0.01) j++;
      }
      return transfers;
    }

    function formatSar(num) { return (Number(num) || 0).toFixed(2); }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderAll() {
      const { total, perHead, paidBy, balances } = calculateTotals(state.expenses);

      document.getElementById("totalSpend").textContent = formatSar(total);
      document.getElementById("perHeadShare").textContent = formatSar(perHead);
      document.getElementById("itemCountSub").textContent =
        `${state.expenses.length} ${state.expenses.length === 1 ? "item" : "items"} logged this cycle`;
      document.getElementById("expenseCountLabel").textContent =
        `${state.expenses.length} ${state.expenses.length === 1 ? "entry" : "entries"}`;
      document.getElementById("pastCount").textContent = state.pastMonths.length;

      document.getElementById("membersGrid").innerHTML = MEMBERS.map((name) => {
        const paid = paidBy[name] || 0;
        const bal = balances[name] || 0;
        let pillClass = "bal-even";
        let pillText = "Settled (0.00)";
        if (bal > 0.01) {
          pillClass = "bal-credit";
          pillText = `+ Gets back SAR ${formatSar(bal)}`;
        } else if (bal < -0.01) {
          pillClass = "bal-owe";
          pillText = `- Owes SAR ${formatSar(Math.abs(bal))}`;
        }
        return `
          <div class="member-card">
            <div class="member-top">
              <div class="avatar">${name[0]}</div>
              <div>
                <div class="member-name">${name}</div>
                <div class="member-paid-label">Paid So Far</div>
              </div>
            </div>
            <div class="member-paid-val">SAR ${formatSar(paid)}</div>
            <div class="bal-pill ${pillClass}">${pillText}</div>
          </div>
        `;
      }).join("");

      const listEl = document.getElementById("expenseList");
      if (!state.expenses.length) {
        listEl.innerHTML = `<div class="empty-state">No expenses logged yet. Add groceries or langar items above!</div>`;
      } else {
        listEl.innerHTML = [...state.expenses].reverse().map((exp) => `
          <div class="expense-item">
            <div class="exp-main">
              <div class="exp-title">${escapeHtml(exp.item)}</div>
              <div class="exp-meta">Paid by <strong>${escapeHtml(exp.payer)}</strong> • ${escapeHtml(exp.date || "")}</div>
            </div>
            <div class="exp-right">
              <div class="exp-amount">SAR ${formatSar(exp.amount)}</div>
              <button type="button" class="btn-del" onclick="deleteExpense('${escapeHtml(exp.id)}')">Delete</button>
            </div>
          </div>
        `).join("");
      }

      renderPastMonths();
    }

    async function handleAddExpense(e) {
      e.preventDefault();
      const payer = document.getElementById("payerSelect").value;
      const item = document.getElementById("itemInput").value.trim();
      const amount = parseFloat(document.getElementById("amountInput").value);
      if (!item || isNaN(amount) || amount <= 0) return;

      const dateStr = new Date().toLocaleString("en-GB", {
        day: "2-digit",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
      });

      state.expenses.push({
        id: "exp_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        payer,
        item,
        amount: Math.round(amount * 100) / 100,
        date: dateStr
      });

      document.getElementById("itemInput").value = "";
      document.getElementById("amountInput").value = "";
      renderAll();
      await pushToCloud(true);
    }

    async function deleteExpense(id) {
      state.expenses = state.expenses.filter((e) => e.id !== id);
      renderAll();
      await pushToCloud(true);
    }

    function switchTab(tab) {
      const isActive = tab === "active";
      document.getElementById("activeView").style.display = isActive ? "block" : "none";
      document.getElementById("pastView").style.display = isActive ? "none" : "block";
      document.getElementById("tabActiveBtn").classList.toggle("active", isActive);
      document.getElementById("tabPastBtn").classList.toggle("active", !isActive);
    }

    function openSettleModal() {
      const { total, perHead, paidBy, balances } = calculateTotals(state.expenses);
      const transfers = computeTransfers(balances);

      const memberLines = MEMBERS.map((m) => {
        const b = balances[m] || 0;
        const status = b > 0.01 ? `(+${formatSar(b)} SAR)` : b < -0.01 ? `(-${formatSar(Math.abs(b))} SAR)` : "(Settled)";
        return `• ${m}: Paid SAR ${formatSar(paidBy[m])} ${status}`;
      }).join("<br>");

      const transferHtml = transfers.length
        ? transfers.map((t) => `<div class="transfer-item">💸 <strong>${t.from}</strong> pays <strong>${t.to}</strong> → <strong>SAR ${formatSar(t.amount)}</strong></div>`).join("")
        : `<div class="transfer-item">✅ Everyone is already settled up!</div>`;

      document.getElementById("settleSummaryBody").innerHTML = `
        <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 12px;">
          Total Mess Spend: <strong style="color: var(--text);">SAR ${formatSar(total)}</strong> •
          Per-Head Average (÷ 4): <strong style="color: #fcd34d;">SAR ${formatSar(perHead)}</strong>
        </p>
        <div style="font-size: 0.88rem; line-height: 1.7; margin-bottom: 12px;">${memberLines}</div>
        <div class="transfer-box">
          <div class="section-title" style="margin-bottom: 6px;">Who Pays Whom</div>
          ${transferHtml}
        </div>
      `;

      const waTransfers = transfers.length
        ? transfers.map((t) => "• " + t.from + " -> " + t.to + ": SAR " + formatSar(t.amount)).join("\n")
        : "• All settled!";

      lastWhatsAppText = [
        "🍲 *Langar Mafia Mess Settlement (Riyadh)*",
        "Total Spend: *SAR " + formatSar(total) + "*",
        "Per Head (÷ 4): *SAR " + formatSar(perHead) + "*",
        "",
        "*Paid So Far:*",
        "• Umar: SAR " + formatSar(paidBy.Umar),
        "• Yaseen: SAR " + formatSar(paidBy.Yaseen),
        "• Zaka: SAR " + formatSar(paidBy.Zaka),
        "• Tahir: SAR " + formatSar(paidBy.Tahir),
        "",
        "*Who Pays Whom:*",
        waTransfers
      ].join("\n");

      document.getElementById("settleModal").classList.add("open");
    }

    function closeSettleModal() { document.getElementById("settleModal").classList.remove("open"); }

    async function copyWhatsAppSummary() {
      if (!lastWhatsAppText) return;
      try {
        await navigator.clipboard.writeText(lastWhatsAppText);
        showToast("Copied WhatsApp summary!");
      } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = lastWhatsAppText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Copied WhatsApp summary!");
      }
    }

    async function archiveAndResetMonth() {
      if (!state.expenses.length) {
        showToast("No active expenses to archive");
        return;
      }
      const { total, perHead, paidBy, balances } = calculateTotals(state.expenses);
      const transfers = computeTransfers(balances);
      const monthLabel = new Date().toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });

      state.pastMonths.unshift({
        id: "m_" + Date.now(),
        closedOn: monthLabel,
        total,
        perHead,
        paidBy,
        transfers,
        itemCount: state.expenses.length,
        expenses: [...state.expenses]
      });
      state.expenses = [];
      closeSettleModal();
      renderAll();
      await pushToCloud(true);
      switchTab("past");
    }

    function renderPastMonths() {
      const container = document.getElementById("pastMonthsList");
      if (!state.pastMonths.length) {
        container.innerHTML = `<div class="card-box"><div class="empty-state">No settled months archived yet. Click "Settle Month" whenever you close a cycle.</div></div>`;
        return;
      }

      container.innerHTML = state.pastMonths.map((m) => {
        const tLines = (m.transfers && m.transfers.length)
          ? m.transfers.map((t) => `<div>• <strong>${escapeHtml(t.from)}</strong> pays <strong>${escapeHtml(t.to)}</strong>: <strong>SAR ${formatSar(t.amount)}</strong></div>`).join("")
          : `<div>• Settled evenly</div>`;

        return `
          <div class="archive-card">
            <div class="archive-top">
              <strong>Settled on ${escapeHtml(m.closedOn)}</strong>
              <span style="color: #6ee7b7; font-weight: 700;">Total: SAR ${formatSar(m.total)} • Per Head: SAR ${formatSar(m.perHead)}</span>
            </div>
            <div style="font-size: 0.86rem; color: var(--muted); margin-bottom: 8px;">
              Umar: SAR ${formatSar(m.paidBy?.Umar)} | Yaseen: SAR ${formatSar(m.paidBy?.Yaseen)} | Zaka: SAR ${formatSar(m.paidBy?.Zaka)} | Tahir: SAR ${formatSar(m.paidBy?.Tahir)}
            </div>
            <div style="font-size: 0.9rem; line-height: 1.6;">${tLines}</div>
          </div>
        `;
      }).join("");
    }

    loadLocal();
    renderAll();
    syncFromCloud(false);
    setInterval(() => syncFromCloud(false), 8000);
  </script>
</body>
</html>
